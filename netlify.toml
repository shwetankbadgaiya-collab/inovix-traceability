[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_API_URL = "https://inovix-traceability.onrender.com"

# Single-Page Application (SPA) redirect rule
# Ensures direct visits / refreshes on routes like /dashboard, /batches/INV-2026-001, /verify/:token do not 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Production security and cache headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
